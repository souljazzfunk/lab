name: pstack-cc

on:
  pull_request:
    paths:
      - 'pstack-cc/**'
      - 'vendor/pstack/**'
      - '.claude-plugin/**'
      - '.github/workflows/pstack-cc.yml'
  push:
    branches: [main]
    paths:
      - 'pstack-cc/**'
      - 'vendor/pstack/**'
      - '.claude-plugin/**'
      - '.github/workflows/pstack-cc.yml'
  # pstack-upstream-sync.yml が自動の PR に対して起動する
  workflow_dispatch:
  # pstack-upstream-sync.yml が自動マージの前にこの検査を呼ぶ
  workflow_call:
    inputs:
      ref:
        description: 検査するコミット
        type: string
        required: true

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          package-manager-cache: false
      - name: コードの検査（ruff と shellcheck）
        run: |
          pip install ruff==0.15.8
          ruff check pstack-cc/
          command -v shellcheck || sudo apt-get install -y -q shellcheck
          shellcheck pstack-cc/sync-upstream.sh
      - name: 過去に同期を止めた上流の変更で build を試す
        run: python3 -m unittest discover -s pstack-cc -p 'test_*.py'
      - name: 生成物が最新か
        run: python3 pstack-cc/build.py --check
      - name: プラグインと marketplace の検証
        run: |
          npm install -g @anthropic-ai/claude-code@2.1.282
          claude plugin validate --strict pstack-cc/plugin
          claude plugin validate --strict .
