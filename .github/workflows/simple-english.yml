name: simple-english

on:
  pull_request:
    paths:
      - 'simple-english/**'
      - 'vendor/simple-english/**'
      - '.claude-plugin/**'
      - '.github/workflows/simple-english.yml'
  push:
    branches: [main]
    paths:
      - 'simple-english/**'
      - 'vendor/simple-english/**'
      - '.claude-plugin/**'
      - '.github/workflows/simple-english.yml'
  # simple-english-upstream-sync.yml が自動の PR に対して起動する
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          package-manager-cache: false
      - name: shellcheck
        run: |
          command -v shellcheck || sudo apt-get install -y -q shellcheck
          shellcheck simple-english/sync-upstream.sh simple-english/build.sh
      - name: simple-english/plugin が vendor から組み立て直した結果と一致するか
        run: |
          simple-english/build.sh
          git status --porcelain simple-english/plugin
          test -z "$(git status --porcelain simple-english/plugin)"
      - name: プラグインと marketplace の検証
        run: |
          npm install -g @anthropic-ai/claude-code@2.1.282
          claude plugin validate --strict simple-english/plugin/.claude-plugin/plugin.json
          claude plugin validate --strict .
      - name: marketplace からインストールできるか
        run: |
          export HOME="$RUNNER_TEMP/home" && mkdir -p "$HOME"
          claude plugin marketplace add "$GITHUB_WORKSPACE"
          claude plugin install simple-english@lab
