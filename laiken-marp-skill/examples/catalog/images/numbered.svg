<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1140 410" font-family="'Hiragino Sans','Noto Sans JP','Noto Sans CJK JP',sans-serif">
<rect x="20" y="20" width="1100" height="110" rx="18" fill="#ffffff" stroke="#d9d2c2" stroke-width="3"/>
<text x="60" y="90" font-size="40" font-weight="700" fill="#29261f"><tspan fill="#c9602a">①</tspan> 問いを決める</text>
<text x="1080" y="88" text-anchor="end" font-size="32" fill="#6d675a">何を知りたい？</text>
<rect x="20" y="150" width="1100" height="110" rx="18" fill="#ffffff" stroke="#d9d2c2" stroke-width="3"/>
<text x="60" y="220" font-size="40" font-weight="700" fill="#29261f"><tspan fill="#c9602a">②</tspan> グラフを選ぶ</text>
<text x="1080" y="218" text-anchor="end" font-size="32" fill="#6d675a">表で決める</text>
<rect x="20" y="280" width="1100" height="110" rx="18" fill="#ffffff" stroke="#d9d2c2" stroke-width="3"/>
<text x="60" y="350" font-size="40" font-weight="700" fill="#29261f"><tspan fill="#c9602a">③</tspan> 色を絞る</text>
<text x="1080" y="348" text-anchor="end" font-size="32" fill="#6d675a">主役だけ</text>
</svg>
